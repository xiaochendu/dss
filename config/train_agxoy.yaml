# ==============================================================================
# RUN / OUTPUT LAYOUT (hydra-like)
# ==============================================================================
# Main root for this experiment family.
run_root: "./outputs/agxoy"
# Subdir template under run_root.
# Supports CLI/config placeholders and {now:strftime} timestamp token.
run_dir_template: "dss_nf{n_atom_basis}_nr{n_rbf}_bs{batch_size}_lr{lr}/{now:%Y-%m-%d_%H-%M-%S}"

# ==============================================================================
# DATA
# ==============================================================================
data_path: null  # required; set via CLI or override
val_data_path: null  # optional separate validation dataset directory; if set, val split is built from this path
mcmc_files: null  # e.g. [agox_sample_AgxOy_2000.xyz]; null = glob agox_sample_AgxOy_*.xyz
path: "dataset.db"  # DB filename/path (relative paths are placed in run dir)

# ==============================================================================
# TRAINING
# ==============================================================================
batch_size: 32
max_epochs: 100
num_train: 1.0
num_val: 0.0
reuse_train_for_val: true  # keep validation loop active by reusing train split as val when num_val=0
lr: 0.001
limit_train_batches: null
limit_val_batches: null
# Validation cadence: 1.0=every epoch, 0.5=twice/epoch, 2.0=every 2 epochs.
# Preferred: run validation every N epochs.
check_val_every_n_epoch: 1
# Optional intra-epoch override (null disables). Examples: 0.5 => twice per epoch.
val_check_interval: null
# Model checkpointing (snowyflow-style)
checkpoint_monitor: "val_loss"
checkpoint_mode: "min"
checkpoint_save_top_k: 1
checkpoint_save_last: true

# ==============================================================================
# MODEL
# ==============================================================================
cutoff: 6.0
n_atom_basis: 64
n_rbf: 30

# ==============================================================================
# DATALOADER
# ==============================================================================
num_workers: 0

# ==============================================================================
# LOGGING / WANDB
# ==============================================================================
wandb: false  # false=offline/local wandb, true=online sync
wandb_project: "dss"
wandb_run: "dss_agxoy_nf{n_atom_basis}_nr{n_rbf}_bs{batch_size}_lr{lr}"
# If null, uses run dir (recommended so all artifacts share one main directory).
wandb_dir: null

# ==============================================================================
# SURFACE EVAL (validation-time sampling + energy/composition metrics and plots)
# ==============================================================================
surface_eval: false
val_batch_size: 256
val_sample_num_steps: 100
val_sample_postrelax_steps: 0
val_use_regressor_guidance: false
val_guidance_eta: 0.01
# Optional explicit path to train_energies.pt; if null uses <run_dir>/train_energies.pt.
train_energies_path: null
val_save_trajectories: false
val_trajectories_dir: "val_trajectories"

# ==============================================================================
# MACE (optional; used by surface eval when mace_model is set)
# ==============================================================================
mace_model: null  # path or URL to .model file; null = use potential_model for energies
mace_head: "omat_pbe"
mace_device: "cuda"
mace_dtype: "float64"
mace_dispersion: true
mace_enable_cueq: false
